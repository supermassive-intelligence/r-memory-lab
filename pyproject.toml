[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r-memory-lab"
version = "0.1.0"
description = "Research components for external KV storage and split attention"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["experimental*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
